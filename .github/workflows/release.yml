#
# Pushing a tag like v1.0.0 builds .plasmoid, .deb and .rpm and attaches them
# to a draft GitHub release (review the text, then click "Publish").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb-plasmoid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches metadata version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tools/check-version.sh)" = "${GITHUB_REF_NAME}"
      - run: sudo apt-get update && sudo apt-get install -y gettext zip fakeroot
      - run: ./make-package.sh
      - run: packaging/deb/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-plasmoid
          path: dist/*

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: dnf install -y rpm-build gettext tar gzip findutils
      - uses: actions/checkout@v4
      - run: packaging/rpm/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  release:
    needs: [deb-plasmoid, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
