name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Sensor Deck, Plasma and distribution
      placeholder: "Sensor Deck 1.0.0, Plasma 6.6, Fedora 44"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output (optional)
      description: "`journalctl --user -b | grep -i sensordeck`"
      render: text
